services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-langchain_demo}
      MYSQL_USER: ${MYSQL_USER:-langchain_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [internal]
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MEMORY_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      TRUST_PROXY: "true"
      AUTH_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-langchain_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-langchain_demo}
      DESKTOP_RELEASE_DIR: /app/downloads
      DESKTOP_RELEASE_NAME: Nexora-Setup.exe
    volumes:
      - app_data:/app/data
      # 安装包不打进镜像。把 Nexora-Setup.exe 放到仓库 downloads/ 后重启 api
      - ./downloads:/app/downloads:ro
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks: [internal]

  nginx:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/www.lspagent.online.pem:/etc/nginx/ssl/www.lspagent.online.pem:ro
      - ./certs/www.lspagent.online.key:/etc/nginx/ssl/www.lspagent.online.key:ro
    depends_on:
      - api
    networks: [internal]

networks:
  internal:

volumes:
  app_data:
  mysql_data: