services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MEMORY_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      TRUST_PROXY: "true"
    volumes:
      - app_data:/app/data
    depends_on:
      - redis
    networks: [internal]

  nginx:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks: [internal]

networks:
  internal:

volumes:
  app_data:
