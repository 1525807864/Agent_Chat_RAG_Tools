services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-langchain_demo}
      MYSQL_USER: ${MYSQL_USER:-langchain_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [internal]

  # ===== 新增：Holmes 常驻 sidecar（不对公网暴露端口）=====
  holmes:
    # 方案 A：用官方镜像（推荐先试）
    image: ${HOLMES_IMAGE:-robustadev/holmes:latest}
    # 方案 B：改成本地构建时，注释掉 image，打开下面 build：
    # build:
    #   context: ./third_party/holmesgpt
    #   dockerfile: Dockerfile
    # image: nexora-holmes:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 与 Nexora 共用 DeepSeek；按你本机已跑通的变量对齐
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      # 若 Holmes 进程要开鉴权，与 HOLMES_API_KEY 保持一致
      HOLMES_API_KEY: ${HOLMES_API_KEY:-}
      # 模型名按你 holmes 配置；没有 modelList 时可直接 openai/deepseek-*
      MODEL: ${HOLMES_DEFAULT_MODEL:-deepseek}
    # 官方镜像默认 ENTRYPOINT 是 CLI；覆盖成 HTTP 服务（端口以你镜像为准）
    # 若 robustadev/holmes 的启动方式不同，改成镜像文档里的 serve 命令
    command: ["python", "server.py"]
    # 不映射到宿主机，只给 api 内网访问
    expose:
      - "5050"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5050/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal]

  # ===== 新增：只构建沙箱镜像，不常驻 =====
  # update.sh 里：docker compose build sandbox-image
  sandbox-image:
    build:
      context: ./docker/sandbox
      dockerfile: Dockerfile
    image: nexora-sandbox:latest
    profiles: ["build"]   # 默认 up 不会起这个空容器

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MEMORY_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      TRUST_PROXY: "true"
      AUTH_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-langchain_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-langchain_demo}
      DESKTOP_RELEASE_DIR: /app/downloads
      DESKTOP_RELEASE_NAME: Nexora-Setup.exe

      # --- 生产覆盖：指向 compose 内网 Holmes ---
      HOLMES_ENABLED: "true"
      HOLMES_API_BASE: http://holmes:5050

      # --- 生产覆盖：沙箱 ---
      SANDBOX_ENABLED: "true"
      SANDBOX_RUNTIME: docker
      SANDBOX_IMAGE: nexora-sandbox:latest
      # ★ 必须是宿主机绝对路径（docker.sock 场景）
      SANDBOX_WORKSPACE_HOST: ${SANDBOX_WORKSPACE_HOST:-/opt/LangChain_Demo/data/sandbox}

      # --- 交互终端（可选；API 镜像需装 ttyd）---
      OPS_TTYD_ENABLED: ${OPS_TTYD_ENABLED:-true}
      OPS_TTYD_BIN: ttyd
      OPS_TTYD_BIND: 127.0.0.1
      OPS_TTYD_ALLOWED_ORIGINS: ${OPS_TTYD_ALLOWED_ORIGINS:-https://www.lspagent.online}

    volumes:
      - app_data:/app/data
      - ./downloads:/app/downloads:ro
      # 沙箱工作区：容器内路径与宿主机同一目录树，便于 docker run -v
      - ${SANDBOX_WORKSPACE_HOST:-/opt/LangChain_Demo/data/sandbox}:${SANDBOX_WORKSPACE_HOST:-/opt/LangChain_Demo/data/sandbox}
      # 让 api 能 docker run / docker exec 沙箱（权限很大，仅生产运维机）
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
      holmes:
        condition: service_started
    networks: [internal]

  nginx:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/www.lspagent.online.pem:/etc/nginx/ssl/www.lspagent.online.pem:ro
      - ./certs/www.lspagent.online.key:/etc/nginx/ssl/www.lspagent.online.key:ro
    depends_on:
      - api
    networks: [internal]

networks:
  internal:

volumes:
  app_data:
  mysql_data: