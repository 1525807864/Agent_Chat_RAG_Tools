# 本机用的 nginx：静态页 + 反代 /api → api:8020，不搞 TLS
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-local-conf
  namespace: nexora
data:
  default.conf: |
    upstream langchain_api {
        server api:8020;
        keepalive 8;
    }
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://langchain_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 25m;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location /health {
            proxy_pass http://langchain_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: nexora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: langchain_demo-nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            # 盖掉镜像里要求证书的那份 conf
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: conf
          configMap:
            name: nginx-local-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: nexora
spec:
  # Docker Desktop 上 LoadBalancer 会映射到 localhost。
  # 用 8080：本机/WSL 常已占用 127.0.0.1:80（会看到官方 Welcome to nginx）。
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 80