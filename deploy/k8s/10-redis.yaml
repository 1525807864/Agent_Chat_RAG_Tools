# Redis：会话 / 限流用。本机测试不开持久化，重启丢数据没关系
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nexora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # Desktop K8s 和 Docker 共用镜像，本地有就直接用
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nexora
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379