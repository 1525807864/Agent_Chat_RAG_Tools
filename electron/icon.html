<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>分析</title>
    <style>
      html,
      body {
        margin: 0;
        width: 44px;
        height: 44px;
        overflow: hidden;
        background: transparent;
        -webkit-app-region: no-drag;
      }
      button {
        display: block;
        width: 44px;
        height: 44px;
        padding: 0;
        border: none;
        border-radius: 50%; /* 强制圆形点击区 */
        overflow: hidden;
        cursor: pointer;
        background: transparent;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      }
      button img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        pointer-events: none;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <button id="btn" type="button" title="分析选中内容">
      <!-- 相对 icon.html：同目录 assets/selection-fab.png -->
      <img src="./assets/selection-fab.png" alt="分析" />
    </button>
    <script>
      document.getElementById("btn").onclick = () => {
        window.iconAPI?.analyze();
      };
    </script>
  </body>
</html>
