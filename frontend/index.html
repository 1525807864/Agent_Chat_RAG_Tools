<!doctype html>
<!-- HTML5 文档类型声明 -->
<html lang="zh-CN">
  <!-- 根元素：页面语言设为简体中文，利于无障碍与 SEO -->
  <head>
    <!-- 文档头部：元信息与标题 -->
    <meta charset="UTF-8" />
    <!-- 字符编码 UTF-8，避免中文乱码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 移动端视口：宽度=设备宽，初始缩放 1 -->
    <title>LangChain Demo Agent</title>
    <!-- 浏览器标签标题 -->
  </head>
  <body>
    <!-- 文档主体 -->
    <!-- React 挂载点：main.tsx 的 createRoot 会渲染到这个 div -->
    <div id="root"></div>
    <!-- Vite 入口：以 ES Module 方式加载前端 TypeScript 入口 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
